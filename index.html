/* ===== ONLINE ADMIN · ЧАСТЬ 1: надпись на экране у всех + вкладка «Онлайн» ===== */
const OLA={tab:"local",theme:"gold",dur:10,pop:true,draft:"",banner:null,src:"",canEdit:false,shown:"",popT:0};
const OLB_THEMES=[["gold","Золото"],["pink","Розовый"],["blue","Синий"],["red","Тревога"],["green","Зелёный"],["violet","Фиолет"]];
const OLB_DURS=[["Пока не уберу",0],["1 мин",1],["10 мин",10],["1 час",60],["6 ч",360],["24 ч",1440]];
// надпись приходит от других устройств: проверяем каждое поле и в DOM кладём только textContent
function olbClean(d){
  if(!d||typeof d!=="object")return null;
  const t=+d.t;if(!(t>0))return null;
  const text=String(d.text==null?"":d.text).replace(/[\u0000-\u001f\u007f]/g," ").trim().slice(0,200);
  return {id:String(d.id||t).slice(0,40),on:d.on===true&&!!text,text,
    theme:OLB_THEMES.some(x=>x[0]===d.theme)?d.theme:"gold",pop:d.pop===true,until:+d.until>0?+d.until:0,t};
}
function olBannerApply(d,src){
  if(d===null){if(OLA.src==="db"&&src==="db"){OLA.banner=null;olBannerTick();olAdminRefresh();}return;}
  const b=olbClean(d);if(!b)return;
  if(OLA.banner&&OLA.banner.t>b.t)return;   // берём самую свежую (из базы или из комнаты)
  OLA.banner=b;OLA.src=src;olBannerTick();olAdminRefresh();
}
function olbFresh(k){try{if(sessionStorage.getItem("olb_seen")===k)return false;sessionStorage.setItem("olb_seen",k);}catch(e){}return true;}
function olBannerTick(){
  const b=OLA.banner,live=!!(b&&b.on&&(!b.until||b.until>Date.now())),key=live?b.id+"|"+b.t:"";
  if(key===OLA.shown)return;
  OLA.shown=key;
  const el=document.getElementById("ol-banner");if(!el)return;
  if(!live){el.classList.remove("on");document.body.classList.remove("has-olb");document.documentElement.style.setProperty("--bnr-h","0px");olPopHide();return;}
  el.dataset.th=b.theme;
  document.getElementById("olb-text").textContent=b.text;
  el.classList.add("on");document.body.classList.add("has-olb");
  olBannerFit();
  if(b.pop&&Date.now()-b.t<120000&&olbFresh(key))olPopShow(b);
}
function olBannerFit(){
  const el=document.getElementById("ol-banner"),tr=document.getElementById("olb-track"),tx=document.getElementById("olb-text");
  if(!el||!tr||!tx||!el.classList.contains("on"))return;
  tr.classList.remove("scroll");
  let rm=false;try{rm=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  const w=tx.offsetWidth,c=tr.clientWidth;
  if(!rm&&w>c){tr.style.setProperty("--olb-from",c+"px");tr.style.setProperty("--olb-to",(-w)+"px");tr.style.setProperty("--olb-dur",Math.max(6,(c+w)/55)+"s");tr.classList.add("scroll");}
  document.documentElement.style.setProperty("--bnr-h",el.offsetHeight+"px");
}
function olPopShow(b){
  const p=document.getElementById("ol-pop");if(!p)return;
  document.getElementById("olb-card").dataset.th=b.theme;
  document.getElementById("olb-msg").textContent=b.text;
  p.classList.add("on");clearTimeout(OLA.popT);OLA.popT=setTimeout(olPopHide,6000);
}
function olPopHide(){const p=document.getElementById("ol-pop");if(p)p.classList.remove("on");clearTimeout(OLA.popT);}

/* --- запись надписи (только admin: правило db global/* + топик room "banner") --- */
async function olBannerPut(d){
  try{await OL.db.doc("global/banner").set(d);}

  return true;
}
async function olBannerSend(){
  if(!OL.on)return toast("Онлайн не подключён");
  olAdminPrev();
  const text=OLA.draft.replace(/\s+/g," ").trim().slice(0,140);
  if(!text)return toast("Напишите текст надписи");
  if(await olBannerPut({id:uid(),on:true,text,theme:OLA.theme,pop:!!OLA.pop,until:OLA.dur?Date.now()+OLA.dur*60000:0,t:Date.now()}))toast("📢 Надпись показана всем");

async function olBannerOff(){

  await olNames([id]);olApplyName();olSync();
  db.collection("players").onSnapshot(sn=>{OL.players=sn.docs.map(d=>({id:d.id,...d.data()}));olNames(OL.players.map(p=>p.id)).then(olRefresh);olRefresh();});
  db.collection("lots").onSnapshot(sn=>{OL.lots=sn.docs.map(d=>olLotOk({id:d.id,...d.data()})).filter(Boolean).sort((a,b)=>b.t-a.t);olNames(OL.lots.map(l=>l.seller)).then(olRefresh);olRefresh();});
  db.collection("payouts").where("to","==",id).onSnapshot(sn=>sn.docChanges().forEach(ch=>{
    if(ch.type!=="added")return;const d=ch.doc.data();
    if(RATE[d.cur]&&d.amount>0&&d.amount<1e12){addMoney(d.cur,d.amount);save();updateBalanceUI();toast("Продано игроку: "+String(d.name||"предмет").slice(0,40)+" +"+fmtNum(d.amount));}
    db.doc("payouts/"+ch.doc.id).delete().catch(()=>{});
  }));
  if(room)room.on("drop",m=>{const d=m.data;if(!d||typeof d.n!=="string"||!(d.v>0))return;
    olNames([m.by]).then(()=>{const c={who:m.isMe?"Вы":olName(m.by),e:String(d.e||"🎁").slice(0,8),v:Math.round(d.v)};OL.feed.unshift(c);OL.feed.length=Math.min(OL.feed.length,8);
      const f=document.querySelector("#view-home .live-feed");if(f)f.insertAdjacentHTML("afterbegin",feedCard(c));
      if(!m.isMe&&d.v>=2000)toast("🎉 "+c.who+" выбил "+d.n.slice(0,40));});});
}catch(e){}})();
</script>
