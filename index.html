<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TG Gifts Online</title>
<style>
:root{
  --bg:#141724; --bg-panel:#1e2235; --bg-card:#252a41;
  --txt:#ffffff; --mut:#8b93a7; --line:#2a304a;
  --accent:#7b68ee; --accent-blue:#4d78cc; --gold:#ffd166;
  --danger:#ff4d6d; --success:#7fff00;
  
  --rar-common:#8b93a7; --rar-uncommon:#5aa9ff; --rar-rare:#3d6fff;
  --rar-epic:#a35bff; --rar-legendary:#ff5ba0; --rar-master:#ff3b3b; --rar-limited:#ffd166;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:170px;min-height:100vh;overflow-x:hidden;
}
button{border:0;color:var(--txt);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;transition:filter .15s,transform .1s;font-family:inherit}
button:hover{filter:brightness(1.1)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed;filter:none}
input,select{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;outline:none;font-weight:500}
input:focus,select:focus{border-color:var(--accent)}

/* ШАПКА */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(20,23,36,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:12px 16px;
  display:flex;justify-content:space-between;align-items:center;
}
.brand{font-weight:900;font-size:20px;display:flex;align-items:center;gap:6px}
.brand .logo-ico{color:var(--gold);font-size:22px}
.header-right{display:flex;align-items:center;gap:8px}
.header-balance{
  display:flex;align-items:center;gap:6px;background:var(--bg-panel);
  border:1px solid var(--line);padding:6px 12px;border-radius:20px;
  font-weight:900;font-size:14px;cursor:pointer;
}
.header-balance span{color:var(--gold);font-size:16px}
.tg-avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-blue));
  display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px;
}

/* ОСНОВА */
main{max-width:600px;margin:auto;padding:12px}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.section-title{font-size:22px;font-weight:900;margin:16px 0;display:flex;align-items:center;gap:10px}
h2{font-size:20px;margin:0 0 14px}
h3{font-size:15px;color:var(--mut);margin:16px 0 10px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--mut)}
.small{font-size:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}

/* ЛЕНТА LIVE */
.live-feed{display:flex;gap:8px;overflow-x:auto;padding:8px 0 16px;scrollbar-width:none}
.live-feed::-webkit-scrollbar{display:none}
.live-card{
  flex:0 0 180px;background:var(--bg-panel);border:1px solid var(--line);
  border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;
}
.live-card.red{background:linear-gradient(135deg,#3a1824,#1e1c2a);border-color:#4a2034}
.live-card.blue{background:linear-gradient(135deg,#1c1e3a,#1e1c2a);border-color:#2a2e54}
.live-card.gold{background:linear-gradient(135deg,#4a3e18,#1e1c2a);border-color:#544a20}
.live-card .avatar{width:36px;height:36px;border-radius:50%;background:#3b4460;display:grid;place-items:center;font-size:16px;flex-shrink:0}
.live-card .info{flex:1;min-width:0}
.live-card .info b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-card .info span{display:block;font-size:12px;color:var(--gold);font-weight:800;text-align:right;margin-top:2px}

/* КЕЙСЫ */
.carousel-wrapper{position:relative;margin:0 -12px;padding:0 12px;overflow:hidden}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px 0;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.case-card{
  scroll-snap-align:center;flex:0 0 160px;height:200px;
  background:var(--bg-panel);border:2px solid var(--line);border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:20px 12px 16px;cursor:pointer;position:relative;transition:.2s;
}
.case-card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.case-card .emoji-icon{font-size:56px;margin-bottom:auto;margin-top:20px}
.case-card .name{font-size:14px;font-weight:800;text-align:center;line-height:1.2}
.case-card .price{font-size:12px;color:var(--gold);margin-top:4px;font-weight:700}

/* МОДАЛКИ */
.modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.dialog{
  width:100%;max-width:600px;background:var(--bg);
  border-top-left-radius:24px;border-top-right-radius:24px;
  padding:20px;max-height:90vh;overflow-y:auto;position:relative;
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.dialog .close{
  position:absolute;top:16px;right:16px;background:var(--bg-card);
  border-radius:50%;width:32px;height:32px;display:grid;place-items:center;
  font-size:16px;color:var(--mut);z-index:10;
}
.dialog-header{margin-bottom:16px}
.dialog-header h2{font-size:20px;font-weight:900;margin:0}

/* КАРТОЧКИ */
.item-card{
  background:var(--bg-card);border-radius:16px;padding:10px;
  display:flex;flex-direction:column;position:relative;border:2px solid transparent;
  transition:.15s;overflow:hidden;
}
.item-card.rar-common{border-color:#3a4358}
.item-card.rar-uncommon{border-color:#2e5f9c}
.item-card.rar-rare{border-color:#2c4fd6}
.item-card.rar-epic{border-color:#7a3dc8}
.item-card.rar-legendary{border-color:#c73d80}
.item-card.rar-master{border-color:#c72d2d}
.item-card.rar-limited{border-color:var(--gold);box-shadow:0 0 14px #ffd16655}
.item-bg{
  height:90px;border-radius:10px;display:grid;place-items:center;
  position:relative;margin-bottom:8px;background:linear-gradient(135deg,#1e2235,#141724)
}
.item-visual img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.item-name{font-size:12px;font-weight:700;line-height:1.2;margin-bottom:4px;text-align:center}
.item-price{font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:auto}
.item-actions{display:flex;gap:6px;margin-top:6px}
.pat-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:6px;font-size:13px;z-index:2}
.num-badge{position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.8);padding:2px 6px;border-radius:6px;font-size:10px;font-family:monospace;color:var(--gold);font-weight:700;z-index:2}

/* Кнопки */
.btn-yellow{background:linear-gradient(180deg,#ffdb5b,#f5b71a);color:#261800;flex:1;padding:8px 4px;font-size:11px;font-weight:900;text-align:center;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
.btn-purple{background:linear-gradient(180deg,#8c5bf5,#6b3ceb);color:#fff;flex:1;padding:8px 4px;font-size:11px;font-weight:900;text-align:center;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}

/* Превью кейса */
.preview-grid{display:grid;gap:10px;margin-bottom:20px}
.preview-grid.x1{grid-template-columns:repeat(2,1fr)}
.preview-grid.x2{grid-template-columns:repeat(3,1fr)}
.preview-grid.x3{grid-template-columns:repeat(3,1fr)}
.preview-grid.x4{grid-template-columns:repeat(4,1fr)}
.preview-grid.x5{grid-template-columns:repeat(5,1fr)}

.btn-open-case{
  width:100%;padding:16px;font-size:18px;font-weight:900;
  background:linear-gradient(180deg,#7b68ee,#5b48d1);
  border-radius:16px;color:#fff;margin-bottom:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.tools-bar{display:flex;justify-content:space-between;align-items:center;gap:6px;background:rgba(255,255,255,.05);padding:6px;border-radius:16px}
.multipliers{display:flex;gap:4px}
.mult-btn{background:transparent;color:var(--mut);font-size:14px;font-weight:700;padding:8px 12px;border-radius:12px}
.mult-btn.sel{background:var(--accent);color:#fff}
.tool-icons{display:flex;gap:4px}
.tool-icons button{background:transparent;color:var(--mut);padding:8px;font-size:16px;border-radius:12px}

/* НАВИГАЦИЯ */
.bottom-nav{
  position:fixed;z-index:100;bottom:0;left:0;right:0;
  background:rgba(20,23,36,.95);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:8px;
  display:flex;justify-content:space-around;align-items:center;
}
.bottom-nav button{
  background:transparent;border:0;color:var(--mut);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 10px;font-size:10px;font-weight:700;
}
.bottom-nav button.sel{color:var(--accent)}
.bottom-nav button span.ico{font-size:22px;line-height:1}

/* БАЛАНС-БАР */
.balance-bar{
  position:fixed;z-index:101;bottom:60px;left:0;right:0;
  display:flex;justify-content:center;gap:8px;padding:8px;
  background:rgba(20,23,36,.9);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
}
.balance-bar button{
  background:var(--bg-card);border:1px solid var(--line);
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;
  color:#fff;display:flex;align-items:center;gap:6px;
}

/* Кнопка Info */
.info-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.1);
  color:var(--mut);font-size:12px;font-weight:900;font-family:serif;
  cursor:pointer;border:1px solid var(--line);margin-left:6px;transition:.2s;
}
.info-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ТОСТ */
.toast{
  display:none;position:fixed;z-index:400;bottom:180px;left:50%;transform:translateX(-50%);
  background:#fff;color:#111;padding:10px 18px;border-radius:12px;
  font-weight:600;font-size:13px;box-shadow:0 6px 24px #0008;max-width:90vw;text-align:center;
}
.toast.show{display:block;animation:toastIn .2s ease}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ВХОД */
#tg-login-screen{
  position:fixed;inset:0;z-index:500;
  background:linear-gradient(160deg,#060913,#0e1424 60%,#152040);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
#tg-login-screen.open{display:flex}
#tg-login-screen .logo{font-size:64px;margin-bottom:16px}
#tg-login-screen h1{font-size:28px;margin:0 0 8px}
#tg-login-screen p{color:var(--mut);margin:0 0 28px;max-width:340px}
#tg-login-screen button{
  padding:14px 32px;font-size:16px;
  background:linear-gradient(135deg,#4da6ff,#7f7fff);
  box-shadow:0 8px 32px #4da6ff44;
}

/* РУЛЕТКА */
.roulette-window {
  width: 100%; overflow: hidden; position: relative;
  border: 2px solid var(--line); border-radius: 14px;
  background: var(--bg-panel); margin-bottom: 20px;
}
.roulette-window:after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%;
  width: 3px; background: #fff; box-shadow: 0 0 10px #fff;
  transform: translateX(-50%); z-index: 10;
}
.roulette-track {
  display: flex; gap: 8px; padding: 12px;
  will-change: transform;
}
.roll-card {
  flex: 0 0 90px; height: 100px; background: var(--bg-card);
  border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 6px;
}
.roll-card .emoji { font-size: 32px; margin-bottom: 4px; }
.roll-card .small { font-size: 10px; color: var(--mut); line-height: 1.1; }
.roll-card.gold { border-color: var(--gold); box-shadow: 0 0 15px #ffd16688; }

/* КРАФТ */
.craft-anim { display: flex; gap: 8px; justify-content: center; align-items: center; min-height: 60px; font-size: 32px; margin: 12px 0; }

/* ВКЛАДКИ */
.tabs button {
  background: var(--bg-card); border: 1px solid var(--line);
  color: var(--mut); padding: 8px 16px; border-radius: 20px;
  font-size: 13px; font-weight: 700; white-space: nowrap;
}
.tabs button.sel { background: var(--accent); color: #fff; border-color: var(--accent); }

/* БЛОК BOX */
.box {
  background: var(--bg-panel); border: 1px solid var(--line);
  border-radius: 16px; padding: 16px; margin-bottom: 16px;
}

/* PREMIUM БЕЙДЖ */
.badge-premium {
  display: inline-block; background: linear-gradient(135deg, #ffd166, #c9962a);
  color: #1a1200; padding: 2px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 900; letter-spacing: .5px;
}

.roulette-window{margin-bottom:12px}
.roll-card{position:relative;transition:opacity .4s,transform .4s}
.roll-card.rar-common{border-color:var(--rar-common)}.roll-card.rar-uncommon{border-color:var(--rar-uncommon)}
.roll-card.rar-rare{border-color:var(--rar-rare)}.roll-card.rar-epic{border-color:var(--rar-epic)}
.roll-card.rar-legendary{border-color:var(--rar-legendary)}.roll-card.rar-master{border-color:var(--rar-master)}
.roll-card.rar-limited{border-color:var(--gold);box-shadow:0 0 15px #ffd16688}
.roll-card.dim{opacity:.3}
.roll-card.win{transform:scale(1.12);z-index:3;animation:winPulse 1s ease-in-out infinite}
@keyframes winPulse{0%,100%{box-shadow:0 0 8px var(--gold)}50%{box-shadow:0 0 26px var(--gold)}}
.enhance-item-preview{width:120px;height:120px;border-radius:20px;margin:16px auto;display:grid;place-items:center;background:var(--bg-card)}
.enhance-item-preview.spinning{animation:enhSpin 1s linear infinite}
@keyframes enhSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
.enhance-result{text-align:center;min-height:90px}
.enhance-stat{font-size:14px;margin:4px 0}
.tool-icons button.on{background:var(--accent);color:#fff}
.bottom-nav{padding-bottom:calc(8px + env(safe-area-inset-bottom))}

/* АПГРЕЙД (в стиле RUBUP) */
.up-stage{background:linear-gradient(180deg,#1b1f33,#171a2b);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.up-wheel{position:relative;width:230px;height:230px;margin:4px 0}
.up-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(#2a304a 0 100%);-webkit-mask:radial-gradient(farthest-side,transparent 72%,#000 73%);mask:radial-gradient(farthest-side,transparent 72%,#000 73%)}
.upgrade-pointer{position:absolute;inset:0;z-index:3;pointer-events:none;transform-origin:50% 50%}
.upgrade-pointer:after{content:"";position:absolute;top:-6px;left:50%;width:6px;height:46px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 10px #fff}
.up-center{position:absolute;inset:42px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#2b3150,#161a2c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 4px 16px rgba(0,0,0,.6);z-index:2;text-align:center}
.up-center img{width:54px;height:54px;object-fit:contain}
.up-chv{font-size:16px;font-weight:900;color:var(--gold)}
.up-mults{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.up-chip{background:var(--bg-card);border:1px solid var(--line);color:var(--txt);padding:7px 11px;border-radius:10px;font-size:13px;font-weight:700}
.up-chip.sel{background:var(--accent);border-color:var(--accent)}
.up-sum{display:flex;gap:8px;width:100%}
.up-box{flex:1;min-width:0;background:var(--bg-card);border-radius:14px;padding:10px;cursor:pointer}
.up-box.src{border:1px solid rgba(123,104,238,.5)}
.up-box.dst{border:1px solid rgba(255,209,102,.5)}
.up-box .t{font-size:10px;color:var(--mut)}
.up-box .n{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-box .v{font-size:12px;color:var(--gold);font-weight:800}
.up-extra{display:flex;flex-wrap:wrap;gap:6px;width:100%;align-items:center}
.btn-upgrade-big{width:100%;padding:16px;font-size:16px;font-weight:900;background:linear-gradient(180deg,#ffdb5b,#f5b71a);color:#261800;border-radius:14px}
.item-card.picked{border-color:var(--gold)!important;box-shadow:0 0 14px #ffd16666}
.up-ch{font-size:12px;font-weight:900;color:var(--success);text-align:center;margin-top:2px}
/* ===== v22 ===== */
@keyframes wallmove{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.hb-s{padding:6px 9px!important;font-size:13px!important}
#luck-chip{display:none;align-items:center;background:linear-gradient(135deg,#1f9d55,#7fff00);color:#06210f;font-weight:900;font-size:11px;padding:5px 8px;border-radius:14px;white-space:nowrap}
.case-card2{scroll-snap-align:center;flex:0 0 150px;background:var(--bg-panel);border:1px solid var(--line);border-radius:20px;padding:8px 8px 12px;cursor:pointer;text-align:center;transition:.2s}
.case-card2:hover{transform:translateY(-4px);box-shadow:0 8px 24px #0006}
.case-card2 .name{font-size:13px;font-weight:800;margin-top:8px;line-height:1.15;min-height:30px;display:flex;align-items:center;justify-content:center}
.case-card2 .price{font-size:12px;color:var(--gold);font-weight:800}
.cart{position:relative;height:104px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 40%,var(--c2),#0000 70%),linear-gradient(160deg,var(--c1),var(--c2));display:grid;place-items:center}
.cart.big{height:150px;margin-bottom:14px;border-radius:18px}
.cart .crate{position:absolute;bottom:-4px;left:18%;right:18%;height:38%;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#ffffff33,#00000066);border:2px solid #ffffff44;box-shadow:inset 0 0 14px #0006}
.cart .crate:after{content:"";position:absolute;left:44%;right:44%;top:0;bottom:0;background:#ffd166aa}
.cart img,.cart>span:not(.sp){position:relative;z-index:2;margin-bottom:22px;filter:drop-shadow(0 6px 10px #0008);animation:cfloat 3s ease-in-out infinite}
.cart .sp{position:absolute;opacity:.7;font-size:14px;animation:cfloat 2s ease-in-out infinite}
@keyframes cfloat{50%{transform:translateY(-6px) rotate(3deg)}}
.cr-board{position:relative;max-width:310px;height:270px;margin:8px auto 12px}
.cr-slot{position:absolute;width:88px;height:88px;border-radius:20px;border:2px dashed #ffffff40;background:#ffffff0d;display:grid;place-items:center;color:var(--mut);font-size:30px;cursor:pointer;transition:.2s}
.cr-slot.full{border-style:solid;border-color:var(--accent);background:none}
.s0{left:0;top:0;--dx:128%;--dy:110%}.s1{right:0;top:0;--dx:-128%;--dy:110%}.s2{left:0;bottom:0;--dx:128%;--dy:-110%}.s3{right:0;bottom:0;--dx:-128%;--dy:-110%}
.cr-it{width:100%;height:100%;border-radius:18px;display:grid;place-items:center;position:relative}
.cr-it small{position:absolute;bottom:3px;right:6px;font-size:9px;font-family:monospace;color:var(--gold)}
.cr-core{position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#2b3150,#12152a);box-shadow:0 0 30px #7b68ee55;transition:.4s;z-index:2}
.cr-core b{font-size:26px;color:var(--gold)}.cr-core small{font-size:10px;color:var(--mut)}

<script>
"use strict";
// HANDOFF: план онлайн-админки в двух частях (что сделано, что осталось) лежит ближе к концу скрипта. Ищи слово HANDOFF.
/* ============================================================
   1. ИНИЦИАЛИЗАЦИЯ TWEMOJI (КАРТИНКИ)
   ============================================================ */
function twemojiUrlOld(emoji) {
  if (!emoji) return "";
  const cps = [];
  for (const ch of emoji) {
    const cp = ch.codePointAt(0);
    if (cp === 0xFE0F) continue;
    cps.push(cp.toString(16));
  }
  return `https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/${cps.join("-")}.svg`;
}

function emojiImg(emoji, size = 40, extraStyle = "") {
  if (!emoji) return "";
  const url = twemojiUrl(emoji);
  return `<img src="${url}" alt="${emoji}" width="${size}" height="${size}" style="vertical-align:middle;${extraStyle}" onerror="this.style.display='none';this.nextElementSibling.style.display='inline'"><span style="display:none;font-size:${size}px;line-height:1">${emoji}</span>`;
}

/* ============================================================
   2. БАЗА ПОДАРКОВ (200 ШТУК)
   ============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd = mulberry32(1337);
const GIFT_ADJ = ["Золотой", "Ледяной", "Огненный", "Тёмный", "Космический", "Кристальный", "Королевский", "Магический", "Стальной", "Неоновый"];
const GIFT_NOUN = ["Мишка", "Сердце", "Роза", "Кекс", "Кольцо", "Шоколад", "Пантера", "Кристалл", "Фейерверк", "Ракета", "Цветок", "Кубок", "Корона", "Звезда", "Луна", "Солнце", "Бабочка", "Кот", "Собака", "Дракон"];
const GIFT_EMOJIS = ["🧸","💝","🌹","🧁","💍","🍫","🐆","💎","🎆","🚀","🌸","🏆","👑","⭐","🌙","☀️","🦋","🐱","🐶","🐉"];

const GIFTS = {};
// Базовые чистые предметы для дешевых пулов
GIFT_NOUN.slice(0, 8).forEach((noun, i) => {
  GIFTS[noun] = { name: noun, emoji: GIFT_EMOJIS[i], price: 10 + i * 15, rarity: i < 3 ? "common" : "uncommon", type: "gift" };
});

// Генерация улучшенных версий (10 * 20 = 200)
let giftCount = 0;
GIFT_ADJ.forEach(adj => {
  GIFT_NOUN.forEach((noun, idx) => {
    giftCount++;
    const price = Math.floor(50 + (giftCount * 25) + rnd() * 100);
    let rarity = "common";
    if (price > 100) rarity = "uncommon";
    if (price > 500) rarity = "rare";
    if (price > 2000) rarity = "epic";
    if (price > 5000) rarity = "legendary";
    if (price > 8000) rarity = "master";

    const name = `${adj} ${noun}`;
    GIFTS[name] = { name, emoji: GIFT_EMOJIS[idx], price, rarity, type: "gift" };
  });
});

/* ============================================================
   3. БАЗА NFT (150 ШТУК)
   ============================================================ */
const NFT_ADJ = ["Алмазный", "Космический", "Кибер", "Хрустальный", "Тёмный", "Солнечный", "Лунный", "Звёздный", "Громовой", "Магический", "Платиновый", "Изумрудный", "Рубиновый", "Сапфировый", "Обсидиановый"];
const NFT_NOUN = ["Кит", "Лев", "Волк", "Дракон", "Феникс", "Тигр", "Орёл", "Панда", "Единорог", "Ворон", "Лис", "Кот", "Медведь", "Бык", "Змей"];
const NFT_EMOJIS = ["🐳","🦁","🐺","🐲","🔥","🐯","🦅","🐼","🦄","🦅","🦊","🐱","🐻","🐂","🐍"];

const NFTS = {};
let nftCount = 0;
NFT_ADJ.forEach(adj => {
  NFT_NOUN.forEach((noun, idx) => {
    nftCount++;
    const price = Math.round(100 * Math.pow(1.0245, nftCount) * (0.9 + rnd() * 0.2)); // 100 … ~23 000 💎
    let rarity = "rare";
    if (price > 2000) rarity = "epic";
    if (price > 6000) rarity = "legendary";
    if (price > 12000) rarity = "master";
    
    const name = `NFT ${adj} ${noun}`;

// Чем красивее номер — тем выше множитель цены
function getBeautyMultiplier(n) {
  if (!n || n.length !== 6) return 1;
  const d = n.split("").map(Number);
  if (/^(\d)\1{5}$/.test(n)) return 25;                       // 777777
  const dir = d[1] - d[0];
  let seq = Math.abs(dir) === 1;
  for (let i = 1; i < 6 && seq; i++) if (d[i] - d[i - 1] !== dir) seq = false;
  if (seq) return 15;                                         // 123456 / 987654
  if (/^\d00000$/.test(n)) return 10;                         // 500000
  if (n === n.split("").reverse().join("")) return 8;         // 123321
  if (/^(\d)\1{2}(\d)\2{2}$/.test(n)) return 6;               // 111222
  if (/^[01]{6}$/.test(n)) return 5;                          // 100110
  if (n.slice(0, 3) === n.slice(3)) return 5;                 // 123123
  if (n[0] === n[5] && n.slice(1, 5) === "0000") return 4;    // 700007
  if (/^(\d)\1(\d)\2(\d)\3$/.test(n)) return 3;               // 112233
  if (/(\d)\1{3}/.test(n)) return 2.5;                        // 4 одинаковые подряд
  if (/(\d)\1{2}$/.test(n)) return 1.8;                       // тройка в конце
  if (/00$/.test(n) || /777|888/.test(n)) return 1.3;
  return 1;
}
function numTag(n) { const m = getBeautyMultiplier(n); return m > 1 ? " ×" + m : ""; }

/* ============================================================
   8. КЕЙСЫ (ВЗВЕШЕННЫЕ ШАНСЫ, ВОЗВРАТ РАСТЁТ С ЦЕНОЙ КЕЙСА)
   ============================================================ */
const RATE = { stars: 1, tons: 10, usd: 100 };   // сколько ⭐ стоит 1 единица валюты
const LIMITED_ALL = [...LIMITED_GIFTS, ...LIMITED_NFTS];
const LIMITED_BY_NAME = {};
LIMITED_ALL.forEach(l => { LIMITED_BY_NAME[l.name] = l; });

// Стоимость предмета каталога в ⭐
function baseValue(b) { return b.type === "nft" ? b.price * 10 : b.price; }

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

// Возврат игроку (RTP): 80% у самых дешёвых кейсов → 92% у самых дорогих
function caseRtp(priceStars) {
  const a = Math.log10(50), b = Math.log10(1e7);
  const t = (Math.log10(Math.max(priceStars, 50)) - a) / (b - a);
  return 0.80 + 0.12 * Math.min(1, Math.max(0, t));
}

// Подбираем веса w = x^-a так, чтобы средний выигрыш = targetRatio * цена кейса
function solveDrops(values, targetRatio) {
  const ev = a => {
    let n = 0, d = 0;
    for (const x of values) { const w = Math.pow(x, -a); n += w * x; d += w; }
    return n / d;
  };
  let lo = -6, hi = 12, a;
  if (targetRatio >= ev(lo)) a = lo;
  else if (targetRatio <= ev(hi)) a = hi;
  else {
    for (let i = 0; i < 80; i++) { a = (lo + hi) / 2; if (ev(a) > targetRatio) lo = a; else hi = a; }
    a = (lo + hi) / 2;
  }
  const w = values.map(x => Math.pow(x, -a));
  const sum = w.reduce((s, v) => s + v, 0);
  return w.map(v => v / sum);
}

function buildCaseDrops(name, price, currency, src) {
  const P = price * RATE[currency];
  let pool;
  if (src === "gifts") pool = [...Object.values(GIFTS), ...LIMITED_GIFTS];
  else if (src === "nfts") pool = [...Object.values(NFTS), ...LIMITED_NFTS];
  else pool = [...Object.values(NFTS), ...LIMITED_GIFTS, ...LIMITED_NFTS];

  const cands = pool.map(b => ({ b, v: baseValue(b) })).sort((x, y) => x.v - y.v);
  // В кейс попадают только предметы от 3% до 2000% цены кейса
  let band = cands.filter(c => c.v >= P * 0.03 && c.v <= P * 20);
  if (band.length < 4) {
    band = cands.slice()
      .sort((x, y) => Math.abs(Math.log(x.v / P)) - Math.abs(Math.log(y.v / P)))
      .slice(0, 4).sort((x, y) => x.v - y.v);
  }

  const rng = mulberry32(hashStr(name));
  const K = Math.min(12, band.length);
  const vmin = band[0].v, vmax = band[band.length - 1].v;
  const used = new Set(), picked = [];
  for (let i = 0; i < K; i++) {
    const target = K === 1 ? vmin : vmin * Math.pow(vmax / vmin, i / (K - 1));
    const near = band
      .map((c, idx) => ({ c, idx, d: Math.abs(Math.log(c.v / target)) }))
      .filter(o => !used.has(o.idx))
      .sort((x, y) => x.d - y.d)
      .slice(0, (i === 0 || i === K - 1) ? 1 : 2);   // крайние предметы берём точно
    if (!near.length) break;
    const o = near[Math.floor(rng() * near.length)];
    used.add(o.idx); picked.push(o.c);
  }
  picked.sort((x, y) => x.v - y.v);

  const probs = solveDrops(picked.map(c => c.v / P), caseRtp(P));
  const drops = picked.map((c, i) => ({ base: c.b, v: c.v, p: probs[i] }));
  const ev = drops.reduce((s, d) => s + d.p * d.v, 0);
  return { drops, ev, rtp: ev / P };
}

function rollDrop(c) {
  let r = Math.random(), acc = 0;
  for (const d of c.drops) { acc += d.p; if (r < acc) return d.base; }
  return c.drops[c.drops.length - 1].base;
}

function randomNftNumber() {
  if (Math.random() < 0.07) {                                // 7% — «красивый» номер
    const R = () => Math.floor(Math.random() * 10), B = () => 1 + Math.floor(Math.random() * 9);
    const a = B(), b = R(), c = R(), t = Math.floor(Math.pow(Math.random(), 0.6) * 9);
    if (t === 0) return String(a).repeat(6);
    if (t === 1) { const up = Math.random() < 0.5, st = up ? 1 + Math.floor(Math.random() * 4) : 6 + Math.floor(Math.random() * 4); return Array.from({ length: 6 }, (_, i) => st + (up ? i : -i)).join(""); }
    if (t === 2) return a + "00000";
    if (t === 3) return "" + a + b + c + c + b + a;
    if (t === 4) return String(a).repeat(3) + String(b).repeat(3);
    if (t === 5) return "" + a + b + c + a + b + c;
    if (t === 6) return "" + a + a + b + b + c + c;
    if (t === 7) return "" + a + a + a + a + b + c;
    return "" + a + b + c + R() + "00";
  }
  return String(Math.floor(100000 + Math.random() * 900000));
}

function getRandomBg() {

  let list = BACKGROUNDS.filter(b => b.rarity === "common" || b.rarity === "uncommon");
  if (roll > 60) list = BACKGROUNDS.filter(b => b.rarity === "rare" || b.rarity === "epic");
  if (roll > 90) list = BACKGROUNDS.filter(b => b.rarity === "legendary" || b.rarity === "master");
  return list[Math.floor(Math.random() * list.length)].id;
}

function getRandomPattern() {
  const roll = Math.random() * 100;
  let list = PATTERNS.filter(p => p.rarity === "uncommon" || p.rarity === "rare");
  if (roll > 70) list = PATTERNS.filter(p => p.rarity === "epic");
  if (roll > 95) list = PATTERNS.filter(p => p.rarity === "legendary" || p.rarity === "master");
  return list[Math.floor(Math.random() * list.length)].id;
}

function getItemPrice(item) {
  if (!item) return 0;
  if (item.isLimited) { const L = LIMITED_BY_NAME[item.name]; return L ? L.price : (item.price || 1000); }
  
  const catalog = item.type === "nft" ? NFTS : GIFTS;
  const base = catalog[item.name]?.price || item.price || 10;
  
  let bgMult = 1;
  if (item.bg) {
    const b = BACKGROUNDS.find(x => x.id === item.bg);
    if (b) bgMult = b.mult;
  }
  
  let patMult = 1;
  if (item.pattern) {
    const p = PATTERNS.find(x => x.id === item.pattern);
    if (p) patMult = p.mult;
  }
  
  let numMult = 1;
  if (item.number) {
    numMult = getBeautyMultiplier(item.number);
  }
  
  return Math.floor(base * bgMult * patMult * numMult);
}

  Object.keys(BOT_TARGETS).forEach(k => {
    if (!Array.isArray(state[k])) state[k] = [];
    while (state[k].length < BOT_TARGETS[k]) state[k].push(makeBotLot(k));
  });
}

// Во сколько раз цена лота выше/ниже оценки предмета
function priceRatio(lot) {
  return toStars(lot.price, lot.currency) / Math.max(1, valueStars(lot.item));
}

function demandInfo(ratio) {
  if (ratio <= 0.8) return { ok: true, text: "🔥 Купят за секунды" };
  if (ratio <= 1.0) return { ok: true, text: "✅ Купят быстро" };
  if (ratio <= 1.15) return { ok: true, text: "⏳ Купят скоро" };
  if (ratio <= 1.3) return { ok: true, text: "🐢 Купят не сразу" };
  return { ok: false, text: "❌ Боты не купят: слишком дорого (макс. 130% оценки)" };
}

// Назначаем время, когда бот купит лот игрока (зависит от цены)
function scheduleBotSale(lot) {
  const r = priceRatio(lot);
  let min, max;
  if (r <= 0.8) { min = 3; max = 10; }
  else if (r <= 1.0) { min = 8; max = 25; }
  else if (r <= 1.15) { min = 25; max = 70; }
  else if (r <= 1.3) { min = 70; max = 180; }
  else { lot.buyAt = null; return; }
  lot.buyAt = Date.now() + (min + Math.random() * (max - min)) * 1000;
}

function botTick() {
    const now = Date.now();
  let changed = false, marketChanged = false;

  // 1) боты покупают лоты игрока
  const sold = [];
  for (let i = state.myLots.length - 1; i >= 0; i--) {
    const lot = state.myLots[i];
    if (lot.buyAt === undefined) { scheduleBotSale(lot); changed = true; }
    if (lot.buyAt && now >= lot.buyAt) {
      const fee = typeof lot.commission === "number" ? lot.commission : 0.1;
      const net = roundCur(lot.price * (1 - fee), lot.currency);
      addMoney(lot.currency, net);
      state.myLots.splice(i, 1);
      sold.push({ lot, net });
      changed = marketChanged = true;
    }
  }
  if (sold.length === 1) toast(`🤖 Бот купил: ${sold[0].lot.item.name} за ${fmtNum(sold[0].net)} ${icon(sold[0].lot.currency)}`);
  else if (sold.length > 1) {
    const sums = {};
    sold.forEach(s => { sums[s.lot.currency] = (sums[s.lot.currency] || 0) + s.net; });
    toast(`🤖 Боты купили ${sold.length} лотов: ` + Object.entries(sums).map(([c, v]) => `${fmtNum(v)} ${icon(c)}`).join(" · "));
  }

  // 2) рынок ботов живёт: часть лотов раскупают, пустые места пополняются
  if (Math.random() < 0.04) {
    const k = pick(Object.keys(BOT_TARGETS));
    if (state[k].length > 3) { state[k].splice(Math.floor(Math.random() * state[k].length), 1); changed = marketChanged = true; }
  }
  const before = BOT_TARGETS.globalLots + BOT_TARGETS.globalNftLots + BOT_TARGETS.globalUsdLots;
  const have = state.globalLots.length + state.globalNftLots.length + state.globalUsdLots.length;
  if (have < before && Math.random() < 0.25) { restockLots(); changed = marketChanged = true; }

  if (changed) {
    save();
    updateBalanceUI();
    if (marketChanged && document.getElementById("view-market").classList.contains("active")) renderMarket();
  }
}

  const el = document.getElementById(id);

let fastOpen = false, demoMode = false, soundOn = false, audioCtx = null;

function toggleTool(k) {
  if (k === "fast") { if (!isPremium()) return toast("Быстрое открытие — только для Premium"); fastOpen = !fastOpen; }
  if (k === "demo") { demoMode = !demoMode; toast(demoMode ? "Демо: бесплатно, без наград" : "Демо выключено"); }

  openCaseInfo(currentCase.id);
}

function addItem(it) { if (it.type === "nft") state.nfts.push(it); else state.gifts.push(it); }

function tickSound() {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 600 + Math.random() * 80; g.gain.value = 0.03;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.03);
  } catch (e) {}
}

function rollFiller() {
  return rollDrop(currentCase);
}

function startCaseOpening() {
  if (isSpinning) return;
  const demo = demoMode;
  const cost = demo ? 0 : currentCase.price * selectedMult;
  if (!canAfford(currentCase.currency, cost)) return toast("Недостаточно средств");

  const winners = [];
  for (let i = 0; i < selectedMult; i++) winners.push(makeItem(rollDrop(currentCase)));
  if (winners.length === 0) return toast("Ошибка кейса: пул пуст");

  if (!demo) {
    addMoney(currentCase.currency, -cost);
    state.opened += selectedMult;
    winners.forEach(w => addItem({ ...w, id: uid() }));
    save();
    updateBalanceUI();
  }
  showRoulette(winners, demo);
}

function showRoulette(winners, demo) {
  isSpinning = true;
  const fast = isPremium() && fastOpen;
  const WIN = 50, N = 60;
  const el = document.getElementById("modal-case-body");
  el.innerHTML = `
    <button class="close" id="roll-close" style="display:none" onclick="closeModal('modal-case')">×</button>
    <div class="dialog-header" style="text-align:center"><h2 id="roll-title">${demo ? "Демо: " : ""}Открываем...</h2></div>
    ${winners.map((w, i) => `<div class="roulette-window"><div class="roulette-track" id="roll-track-${i}"></div></div>`).join("")}
    <div id="roll-result" style="display:none"></div>
    <div id="roll-actions" class="row" style="display:none;flex-wrap:nowrap;gap:10px;margin-top:8px">
      <button class="btn-open-case" style="flex:1;margin:0" onclick="claimWinners(${demo})">${demo ? "Закрыть" : "В инвентарь"}</button>
      <button class="btn-open-case" style="flex:1;margin:0;background:linear-gradient(180deg,#ffdb5b,#f5b71a);color:#261800" onclick="againCase()">Ещё раз</button>
    </div>`;
  openModal("modal-case");

  let finished = 0;
  const finish = () => {
    if (++finished < winners.length) return;
    isSpinning = false;
    el.querySelectorAll(".roulette-window").forEach(x => x.style.display = "none"); el.scrollTop = 0;
    const top = winners.some(w => w.isLimited || w.rarity === "limited");
    document.getElementById("roll-title").textContent = (demo ? "Демо: " : "") + (top ? "🌟 ЗОЛОТАЯ ЛИМИТКА!" : "Успех!");
    const total = winners.reduce((sum, w) => sum + valueStars(w), 0);
    const r = document.getElementById("roll-result");
    r.style.display = "block";
    r.innerHTML = `<div style="display:grid;grid-template-columns:repeat(${Math.min(winners.length, 3)},1fr);gap:10px;max-width:${winners.length === 1 ? "180px" : "none"};margin:12px auto">${winners.map(w => renderItemCard(w)).join("")}</div>
      <p style="text-align:center;font-weight:700;color:var(--gold);margin:8px 0 12px">Выпало на ${Math.floor(total).toLocaleString()} ⭐</p>`;
    document.getElementById("roll-actions").style.display = "flex";
    document.getElementById("roll-close").style.display = "grid";
    onRareDrop(winners, demo);
  };

  requestAnimationFrame(() => requestAnimationFrame(() => {
    winners.forEach((w, i) => {
      const track = document.getElementById("roll-track-" + i);
      let html = "";
      for (let k = 0; k < N; k++) {
        const it = k === WIN ? w : rollFiller();
        const r = it.isLimited ? "limited" : it.rarity;
        html += `<div class="roll-card rar-${r} ${r === "limited" ? "gold" : ""}"><div class="emoji">${emojiImg(it.emoji,42)}</div><div class="small">${it.name}</div></div>`;
      }
      track.innerHTML = html;

      const winCard = track.children[WIN];
      const wnd = track.parentElement.clientWidth;
      const stepW = track.children[1].offsetLeft - track.children[0].offsetLeft;
      const end = -(winCard.offsetLeft + winCard.offsetWidth / 2 + (Math.random() - 0.5) * winCard.offsetWidth * 0.7 - wnd / 2);
      const mark = () => {
        winCard.classList.add("win");
        [...track.children].forEach(c => { if (c !== winCard) c.classList.add("dim"); });
      };

      if (fast) { track.style.transform = `translate3d(${end}px,0,0)`; mark(); setTimeout(finish, 150); return; }

      const dur = 5000 + i * 400, t0 = performance.now();
      let last = -1;
      const frame = now => {
        const p = Math.min(1, (now - t0) / dur);
        const x = end * (1 - Math.pow(1 - p, 4));
        track.style.transform = `translate3d(${x}px,0,0)`;
        const idx = Math.floor((wnd / 2 - x) / stepW);
        if (idx !== last) { last = idx; tickSound(); }
        if (p < 1) requestAnimationFrame(frame);
        else { mark(); setTimeout(finish, 600); }
      };
      requestAnimationFrame(frame);
    });
  }));
}

function enhanceCost(item) {
  const cur = item.type === "nft" ? "tons" : "stars";
  const base = (item.type === "nft" ? NFTS : GIFTS)[item.name]?.price || item.price || 10;
  return { cur, cost: Math.max(cur === "tons" ? 5 : 25, Math.ceil(base * 0.25)) };

function openEnhance(id) {
  const item = findItem(id);
  if (!item) return;
  if (item.bg) return toast("Этот предмет уже улучшен (максимум 1 раз)");
  if (item.isLimited) return toast("Лимитки нельзя улучшать");
  if (enhancingIds.has(id)) return;

  const { cur, cost } = enhanceCost(item);
  if (!canAfford(cur, cost)) return toast(`Недостаточно ${icon(cur)}: нужно ${fmtNum(cost)}`);

  // Результат определяем и сохраняем сразу — обновлением страницы его не отменить
  enhancingIds.add(id);
  addMoney(cur, -cost);
  decorateItem(item);
  save();
  updateBalanceUI();

  const bgInfo = BACKGROUNDS.find(b => b.id === item.bg);
  const patInfo = PATTERNS.find(p => p.id === item.pattern);
  const numMult = getBeautyMultiplier(item.number);
  const newPrice = getItemPrice(item);

let sellCtx = null;

function sellLimits(cur) {
  const fair = fromStars(sellCtx.fair, cur);
  const min = cur === "stars" ? 1 : 0.01;
  return { fair, min, max: Math.max(min, roundCur(fair * 2, cur)) };
}

function openSell(id) {
  const item = findItem(id);
  if (!item) return;
  const defCur = item.type === "nft" ? "tons" : "stars";
  sellCtx = { id, fair: valueStars(item) };
  const fairDef = roundCur(fromStars(sellCtx.fair, defCur), defCur);

  const el = document.getElementById("modal-sell-body");
  el.innerHTML = `
    <button class="close" onclick="closeModal('modal-sell')">×</button>
    <div class="dialog-header">
      <h2>Продажа</h2>
      <p class="small muted">${item.name} · Оценка: ${fmtNum(sellCtx.fair)} ⭐</p>
    </div>
    <div class="row" style="flex-direction:column;gap:12px;margin-bottom:12px;align-items:stretch">
      <div>
        <div class="small muted" style="margin-bottom:4px">Валюта</div>
        <select id="sell-curr" style="width:100%" onchange="onSellCur()">
          <option value="stars" ${defCur === "stars" ? "selected" : ""}>⭐ Звёзды</option>
          <option value="tons" ${defCur === "tons" ? "selected" : ""}>💎 Тонны</option>
          <option value="usd">💵 USD</option>
        </select>
      </div>
      <div>
        <div class="small muted" style="margin-bottom:4px">Цена (до 2× оценки)</div>
        <input type="number" id="sell-price" inputmode="decimal" step="any" value="${fairDef}" min="0" style="width:100%" oninput="updateSellHint()">
      </div>
    </div>
    <div id="sell-hint" class="small" style="margin-bottom:16px;min-height:34px"></div>
    <button class="btn-open-case" onclick="confirmSell('${item.id}')">Выставить лот</button>
  `;
  openModal("modal-sell");
  updateSellHint();
}

function onSellCur() {
  const cur = document.getElementById("sell-curr").value;
  document.getElementById("sell-price").value = roundCur(fromStars(sellCtx.fair, cur), cur);
  updateSellHint();
}

function updateSellHint() {
  const hint = document.getElementById("sell-hint");
  if (!hint || !sellCtx) return;
  const cur = document.getElementById("sell-curr").value;
  const price = parseFloat(document.getElementById("sell-price").value);
  const lim = sellLimits(cur);
  if (!(price > 0)) { hint.innerHTML = `<span class="muted">Введите цену. Оценка: ${fmtNum(lim.fair)} ${icon(cur)}</span>`; return; }
  const ratio = toStars(price, cur) / Math.max(1, sellCtx.fair);
  const d = demandInfo(ratio);
  const fee = isPremium() ? 0.05 : 0.1;
  hint.innerHTML = `<div style="color:${d.ok ? "var(--success)" : "var(--danger)"};font-weight:700">${d.text}</div>
    <div class="muted">Вы получите ≈ ${fmtNum(roundCur(price * (1 - fee), cur))} ${icon(cur)} (комиссия ${Math.round(fee * 100)}%)</div>`;
}

function confirmSell(id) {
  const item = findItem(id);
  if (!item || !sellCtx || sellCtx.id !== id) return;
  const cur = document.getElementById("sell-curr").value;
  const raw = parseFloat(document.getElementById("sell-price").value);
  const lim = sellLimits(cur);
  if (!(raw > 0)) return toast("Введите корректную цену");
  const priceVal = roundCur(raw, cur);
  if (priceVal < lim.min || priceVal > lim.max) return toast(`Цена должна быть от ${fmtNum(lim.min)} до ${fmtNum(lim.max)} ${icon(cur)}`);

  state.nfts = state.nfts.filter(x => x.id !== id);
  state.gifts = state.gifts.filter(x => x.id !== id);

  const lot = {
    id: uid(), item, price: priceVal, currency: cur,
    seller: state.tgProfile ? state.tgProfile.username : "Вы",
    commission: isPremium() ? 0.05 : 0.1
  };
  scheduleBotSale(lot);
  state.myLots.push(lot);

  closeModal("modal-sell");
  save();
  updateBalanceUI();
  renderCollection();
  toast(`Лот выставлен: ${fmtNum(priceVal)} ${icon(cur)}`);
}

/* ============================================================
   18. АПГРЕЙД (В СТИЛЕ RUBUP: ПРЕДМЕТЫ + МНОЖИТЕЛЬ + КОЛЕСО)
   ============================================================ */
const UP_EDGE = 0.05;                              // преимущество казино 5%
const UP_MULTS = [1.5, 2, 3, 5, 10, 20, 50, 100];
const UP_CATALOG = [...Object.values(GIFTS), ...Object.values(NFTS), ...LIMITED_ALL]
  .map((b, k) => ({ base: b, v: baseValue(b), k }));

let upSel = new Set();        // id выбранных предметов из инвентаря
let upExtra = 0;              // сколько ⭐ добавлено с баланса
let upTarget = null;          // выбранная цель (элемент UP_CATALOG)
let upMult = null;            // активный множитель
let upTab = "inv";            // inv | target
let upType = "all";           // all | gift | nft | limited
let upSort = "asc";           // asc | desc
let upQuery = "";
let upLimit = 48;
let upBusy = false;
let upLastAngle = 0;

function upSources() {
  return [...state.gifts, ...state.nfts].filter(x => upSel.has(x.id));
}
function upTotal() {
  return upSources().reduce((s, x) => s + valueStars(x), 0) + upExtra;
}
function upChance(src, dst) {
  if (!(src > 0) || !(dst > 0)) return 0;
  return Math.min(90, (src / dst) * (1 - UP_EDGE) * 100);
}
function upValid(src, e) {                         // цель должна быть дороже, а шанс — не меньше 1%
  return !!e && e.v >= src * 1.05 && upChance(src, e.v) >= 1;
}
function upPickNear(src, want) {
  let best = null, bd = Infinity;
  for (const e of UP_CATALOG) {
    if (!upValid(src, e)) continue;
    const d = Math.abs(Math.log(e.v / want));
    if (d < bd) { bd = d; best = e; }
  }
  return best;
}

function renderUpgrade() {
  const el = document.getElementById("view-upgrade");
  // чистим выбор от предметов, которых уже нет в инвентаре
  const have = new Set([...state.gifts, ...state.nfts].map(x => x.id));
  upSel = new Set([...upSel].filter(id => have.has(id)));
  upExtra = Math.min(upExtra, Math.floor(state.stars));

  el.innerHTML = `
    <div class="section-title">⬆️ Апгрейд</div>
    <div class="up-stage">
      <div class="up-wheel">
        <div class="up-ring" id="up-ring"></div>
        <div class="upgrade-pointer" id="up-pointer"></div>
        <div class="up-center" id="up-center"></div>
      </div>
      <div class="up-mults" id="up-mults">
        ${UP_MULTS.map(m => `<button class="up-chip" data-m="${m}" onclick="setUpMult(${m})">x${m}</button>`).join("")}
        <button class="up-chip" onclick="upAuto()">🎯 50%</button>
      </div>
      <div class="up-sum">
        <div class="up-box src" onclick="setUpTab('inv')"><div class="t">Ваши предметы</div><div class="n" id="up-src-n">Выбрать</div><div class="v" id="up-src-v">0 ⭐</div></div>
        <div class="up-box dst" onclick="setUpTab('target')"><div class="t">Хочу получить</div><div class="n" id="up-dst-n">Выбрать</div><div class="v" id="up-dst-v">0 ⭐</div></div>
      </div>
      <div class="up-extra">
        <span class="small muted">+ с баланса</span>
        <input type="number" id="up-extra" min="0" step="1" inputmode="numeric" value="${upExtra || ""}" placeholder="0 ⭐" oninput="setUpExtra(this.value)" style="flex:1;min-width:90px">
        <button class="up-chip" onclick="addUpExtra(100)">+100</button>
        <button class="up-chip" onclick="addUpExtra(1000)">+1k</button>
        <button class="up-chip" onclick="setUpExtra(Math.floor(state.stars))">Всё</button>
      </div>
      <button class="btn-upgrade-big" id="up-btn" onclick="doUpgrade()" disabled>Апгрейд</button>
      <div id="up-hint" class="small muted" style="text-align:center;min-height:16px"></div>
      <div id="up-result" style="font-weight:800;text-align:center;min-height:20px"></div>
    </div>

    <div class="tabs" style="display:flex;gap:8px;margin:16px 0 10px">
      <button id="up-tab-inv" onclick="setUpTab('inv')">🎒 Мои предметы</button>
      <button id="up-tab-target" onclick="setUpTab('target')">🎯 Цели</button>
    </div>
    <div class="up-tools" id="up-tools"></div>
    <div class="grid-3" id="up-grid"></div>
    <div id="up-more" style="margin-top:10px"></div>
  `;
  renderUpTools();
  renderUpGrid();
  updateUpgradeUI();
}

function setUpTab(t) {
  if (upBusy) return;
  upTab = t; upLimit = 48;
  renderUpTools(); renderUpGrid(); updateUpgradeUI();
}

function renderUpTools() {
  const tools = document.getElementById("up-tools");
  if (!tools) return;
  if (upTab === "target") {
    const types = [["all", "Все"], ["gift", "Подарки"], ["nft", "NFT"], ["limited", "Лимитки"]];
    tools.innerHTML = `
      <div class="tabs" style="display:flex;gap:6px;margin-bottom:8px;overflow-x:auto">
        ${types.map(([k, n]) => `<button class="${upType === k ? "sel" : ""}" onclick="setUpType('${k}')">${n}</button>`).join("")}
        <button onclick="toggleUpSort()">${upSort === "asc" ? "Цена ↑" : "Цена ↓"}</button>
      </div>
      <input type="text" placeholder="Поиск по названию" value="${upQuery.replace(/"/g, "&quot;")}" oninput="setUpQuery(this.value)" style="width:100%;margin-bottom:10px">`;
  } else {
    tools.innerHTML = `<p class="small muted" style="margin:0 0 8px">Нажмите на предметы, которые отдаёте. Чем больше сумма — тем выше шанс.</p>`;
  }
  const a = document.getElementById("up-tab-inv"), b = document.getElementById("up-tab-target");
  if (a) a.classList.toggle("sel", upTab === "inv");
  if (b) b.classList.toggle("sel", upTab === "target");
}

function setUpType(t) { if (upBusy) return; upType = t; upLimit = 48; renderUpTools(); renderUpGrid(); }
function toggleUpSort() { if (upBusy) return; upSort = upSort === "asc" ? "desc" : "asc"; renderUpTools(); renderUpGrid(); }
function setUpQuery(q) { upQuery = q; upLimit = 48; renderUpGrid(); }
function upMore() { upLimit += 48; renderUpGrid(); }

function renderUpGrid() {
  const grid = document.getElementById("up-grid");
  const more = document.getElementById("up-more");
  if (!grid) return;
  if (more) more.innerHTML = "";

  if (upTab === "inv") {
    const items = [...state.gifts, ...state.nfts].sort((a, b) => valueStars(b) - valueStars(a));
    if (!items.length) { grid.innerHTML = `<p class="muted" style="grid-column:1/-1">Инвентарь пуст — откройте кейс или купите предмет на маркете.</p>`; return; }
    grid.innerHTML = items.map(it => {
      const r = it.isLimited ? "limited" : it.rarity;
      const pat = PATTERNS.find(p => p.id === it.pattern);
      return `
        <div class="item-card rar-${r} ${upSel.has(it.id) ? "picked" : ""}" onclick="upPickSource('${it.id}')" style="cursor:pointer">
          <div class="item-bg" style="background:${itemBgCss(it)}">
            ${pat ? `<div class="pat-badge">${pat.emoji}</div>` : ""}
            ${it.number ? `<div class="num-badge">#${it.number}${numTag(it.number)}</div>` : ""}
            <div class="item-visual">${itemImg(it)}</div>
          </div>
          <div class="item-name">${it.name}</div>
          <div class="item-price">${fmtNum(valueStars(it))} ⭐</div>
        </div>`;
    }).join("");
    return;
  }

  // цели
  const src = upTotal();
  const q = upQuery.trim().toLowerCase();
  let list = UP_CATALOG.filter(e => {
    if (upType === "gift" && !(e.base.type === "gift" && !e.base.isLimited)) return false;
    if (upType === "nft" && !(e.base.type === "nft" && !e.base.isLimited)) return false;
    if (upType === "limited" && !e.base.isLimited) return false;
    if (q && !e.base.name.toLowerCase().includes(q)) return false;
    return src > 0 ? upValid(src, e) : true;
  });
  list.sort((a, b) => upSort === "asc" ? a.v - b.v : b.v - a.v);
  if (!list.length) {
    grid.innerHTML = `<p class="muted" style="grid-column:1/-1">${src > 0 ? "Нет целей с шансом от 1% для такой суммы. Добавьте предметов или измените фильтр." : "Ничего не найдено."}</p>`;
    return;
  }
  const shown = list.slice(0, upLimit);
  grid.innerHTML = shown.map(e => {
    const b = e.base;
    const r = b.isLimited ? "limited" : b.rarity;
    const ch = src > 0 ? `${upChance(src, e.v).toFixed(1)}%` : "";
    return `
      <div class="item-card rar-${r} ${upTarget && upTarget.k === e.k ? "picked" : ""}" onclick="upPickTarget(${e.k})" style="cursor:pointer">
        <div class="item-bg" style="background:${itemBgCss(b)}"><div class="item-visual">${itemImg(b)}</div></div>
        <div class="item-name">${b.name}</div>
        <div class="item-price">${fmtNum(e.v)} ⭐</div>
        ${ch ? `<div class="up-ch">${ch}</div>` : ""}
      </div>`;
  }).join("");
  if (more && list.length > shown.length) more.innerHTML = `<button class="btn-purple" style="width:100%;padding:12px" onclick="upMore()">Показать ещё (${list.length - shown.length})</button>`;
}

function upPickSource(id) {
  if (upBusy) return;
  if (upSel.has(id)) upSel.delete(id); else upSel.add(id);
  upRecalc();
}
function upPickTarget(k) {
  if (upBusy) return;
  const e = UP_CATALOG.find(x => x.k === k);
  if (!e) return;
  const src = upTotal();
  if (src > 0 && !upValid(src, e)) return toast("Цель должна быть дороже вашей суммы (шанс не меньше 1%)");
  upTarget = e; upMult = null;
  renderUpGrid(); updateUpgradeUI();
}
function setUpExtra(v) {
  if (upBusy) return;
  let n = Math.floor(parseFloat(v));
  if (!(n > 0)) n = 0;
  upExtra = Math.min(n, Math.floor(state.stars));
  const inp = document.getElementById("up-extra");
  if (inp && String(upExtra || "") !== inp.value) inp.value = upExtra || "";
  upRecalc();
}
function addUpExtra(n) { setUpExtra(upExtra + n); }

function setUpMult(m) {
  if (upBusy) return;
  const src = upTotal();
  if (!(src > 0)) return toast("Сначала выберите предметы или добавьте ⭐");
  const e = upPickNear(src, src * m);
  if (!e) return toast("Для такой суммы нет подходящих целей");
  upMult = m; upTarget = e;
  renderUpGrid(); updateUpgradeUI();
}
function upAuto() {
  if (!isPremium()) return toast("Умный апгрейд — только для Premium");
  if (upBusy) return;
  const src = upTotal();
  if (!(src > 0)) return toast("Сначала выберите предметы или добавьте ⭐");
  const e = upPickNear(src, src * (1 - UP_EDGE) / 0.5);
  if (!e) return toast("Для такой суммы нет подходящих целей");
  upMult = null; upTarget = e;
  renderUpGrid(); updateUpgradeUI();
}

// Пересчёт после смены суммы: активный множитель подбирает цель заново
function upRecalc() {
  const src = upTotal();
  if (upMult && src > 0) { const e = upPickNear(src, src * upMult); if (e) upTarget = e; }
  renderUpGrid(); updateUpgradeUI();
}

function updateUpgradeUI() {
  const $ = id => document.getElementById(id);
  if (!$("up-ring")) return;
  const src = upTotal();
  const srcItems = upSources();
  const ok = src > 0 && upTarget && upValid(src, upTarget);
  const chance = ok ? upChance(src, upTarget.v) : 0;

  // колесо
  $("up-ring").style.background = ok
    ? `conic-gradient(var(--success) 0 ${chance}%, #2a304a ${chance}% 100%)`
    : `conic-gradient(#2a304a 0 100%)`;
  const center = $("up-center");
  if (!upBusy) {
    center.innerHTML = upTarget
      ? `${itemImg(upTarget.base)}<div class="up-chv">${ok ? chance.toFixed(2) + "%" : "—"}</div>`
      : `<div style="font-size:34px">❓</div><div class="up-chv">0%</div>`;
  }

  // сводка
  const names = srcItems.map(x => x.name);
  if (upExtra > 0) names.push(`${fmtNum(upExtra)} ⭐`);
  $("up-src-n").textContent = names.length ? names.join(", ") : "Выбрать";
  $("up-src-v").textContent = `${fmtNum(src)} ⭐`;
  $("up-dst-n").textContent = upTarget ? upTarget.base.name : "Выбрать";
  $("up-dst-v").textContent = upTarget ? `${fmtNum(upTarget.v)} ⭐` : "0 ⭐";

  document.querySelectorAll("#up-mults .up-chip[data-m]").forEach(b => b.classList.toggle("sel", upMult !== null && Number(b.dataset.m) === upMult));

  const btn = $("up-btn");
  if (!upBusy) { btn.disabled = !ok; btn.textContent = ok ? `Апгрейд · шанс ${chance.toFixed(2)}%` : "Апгрейд"; }

  let hint = "";
  if (!src) hint = "Выберите предметы или добавьте ⭐ с баланса";
  else if (!upTarget) hint = "Выберите множитель или цель";
  else if (!ok) hint = "Цель должна быть дороже суммы, а шанс — не меньше 1%";
  else hint = `Выигрыш: ${upTarget.base.name} · при проигрыше всё сгорает`;
  $("up-hint").textContent = hint;

  const a = $("up-tab-inv"), b = $("up-tab-target");
  if (a) a.classList.toggle("sel", upTab === "inv");
  if (b) b.classList.toggle("sel", upTab === "target");
}

function doUpgrade() {
  if (upBusy) return;
  const srcItems = upSources();
  if (srcItems.length !== upSel.size) { upSel = new Set(srcItems.map(x => x.id)); upRecalc(); return toast("Часть предметов уже недоступна"); }
  const extra = Math.min(upExtra, Math.floor(state.stars));
  const src = srcItems.reduce((s, x) => s + valueStars(x), 0) + extra;
  if (!upTarget || !upValid(src, upTarget)) return toast("Выберите корректную цель");
  if (extra > state.stars) return toast("Недостаточно ⭐");

  const chance = upChance(src, upTarget.v);
  const roll = Math.random() * 100;
  const win = roll < chance;
  const target = upTarget;

  // Результат применяем и сохраняем сразу; анимация только показывает его
  upBusy = true;
  srcItems.forEach(it => {
    state.gifts = state.gifts.filter(x => x.id !== it.id);
    state.nfts = state.nfts.filter(x => x.id !== it.id);
  });
  if (extra > 0) addMoney("stars", -extra);
  let prize = null;
  if (win) { prize = makeItem(target.base); addItem(prize); }
  save();
  updateBalanceUI();

  const btn = document.getElementById("up-btn");
  btn.disabled = true; btn.textContent = "Крутим...";
  document.getElementById("up-result").innerHTML = "";

  const pointer = document.getElementById("up-pointer");
  pointer.style.transition = "none";
  pointer.style.transform = `rotate(${upLastAngle % 360}deg)`;
  void pointer.offsetWidth;
  const angle = 360 * 6 + roll * 3.6;
  upLastAngle = angle;
  pointer.style.transition = "transform 4.2s cubic-bezier(.12,.62,.08,1)";
  pointer.style.transform = `rotate(${angle}deg)`;

  setTimeout(() => {
    upBusy = false;
    const center = document.getElementById("up-center");
    if (center) center.innerHTML = win ? `${itemImg(target.base)}<div class="up-chv" style="color:var(--success)">ПОБЕДА</div>` : `<div style="font-size:40px">💥</div><div class="up-chv" style="color:var(--danger)">ПРОВАЛ</div>`;
    const res = document.getElementById("up-result");
    if (res) res.innerHTML = win
      ? `<span style="color:var(--success)">Успех! Получен: ${target.base.name} (${fmtNum(target.v)} ⭐)</span>`
      : `<span style="color:var(--danger)">Не повезло. Предметы сгорели. (выпало ${roll.toFixed(2)}, нужно &lt; ${chance.toFixed(2)})</span>`;
    toast(win ? `Успех! Получен ${target.base.name}` : "Провал. Предметы сгорели.");
    upSel = new Set(); upExtra = 0;
    if (win) { upTarget = null; upMult = null; }
    const inp = document.getElementById("up-extra"); if (inp) inp.value = "";
    renderUpGrid();
    // колесо и итог не трогаем — только сводку и кнопки
    const $ = id => document.getElementById(id);
    $("up-src-n").textContent = "Выбрать"; $("up-src-v").textContent = "0 ⭐";
    $("up-dst-n").textContent = upTarget ? upTarget.base.name : "Выбрать";
    $("up-dst-v").textContent = upTarget ? `${fmtNum(upTarget.v)} ⭐` : "0 ⭐";
    $("up-btn").disabled = true; $("up-btn").textContent = "Апгрейд";
    $("up-hint").textContent = "Выберите предметы для нового апгрейда";
    document.querySelectorAll("#up-mults .up-chip").forEach(b => b.classList.remove("sel"));
  }, 4400);
}

/* ============================================================
   19. КРАФТ NFT
   ============================================================ */
let craftSelected = [];
let craftBusy = false;
let craftResultHtml = "";

// Чем больше NFT вложено, тем выше шанс, но тем меньше множитель приза (средний возврат ~95%)
function craftBaseChance(n) { return Math.min(0.9, 0.40 + 0.10 * (n - 1)); }

function craftPlan() {
  const items = state.nfts.filter(x => craftSelected.includes(x.id));
  if (!items.length) return null;
  const total = items.reduce((s, x) => s + getItemPrice(x), 0);       // в 💎
  const base = craftBaseChance(items.length);
  // Результат — тот же NFT (самый дорогой из положенных), но с новыми фоном, узором и номером
  const sorted = items.slice().sort((x, y) => getItemPrice(y) - getItemPrice(x));
  const top = sorted.find(x => !x.isLimited) || sorted[0];
  const best = NFTS[top.name] || LIMITED_BY_NAME[top.name] || top;
  return { items, total, result: best, chance: Math.min(0.95, base + (isPremium() ? 0.1 : 0)) };
}

function renderCraft() {
  const el = document.getElementById("view-craft");
  craftSelected = craftSelected.filter(id => state.nfts.some(x => x.id === id));
  const plan = craftPlan();
  const info = plan
    ? `<div class="small" style="text-align:center;margin-bottom:8px">Вложено: <b>${fmtNum(plan.total)} 💎</b> · Шанс: <b style="color:var(--gold)">${Math.round(plan.chance * 100)}%</b><br>Результат: ${plan.result.emoji} <b>${plan.result.name}</b> (≈ ${fmtNum(plan.result.price)} 💎)</div>`
    : `<div class="small muted" style="text-align:center;margin-bottom:8px">Выберите NFT ниже</div>`;

  el.innerHTML = `
    <div class="section-title">⚗️ Крафт NFT</div>
    <div class="box">
      <p class="small muted" style="margin:0 0 8px">Выберите до 4 NFT. Чем больше вложите — тем выше шанс, но приз ближе к сумме вложений.</p>
      <div class="craft-anim" id="craft-anim">${craftResultHtml}</div>
      ${info}
      <button class="btn-open-case" id="craft-btn" onclick="doCraft()" ${craftBusy ? "disabled" : ""}>${craftBusy ? "Крафтим..." : "Скрафтить (5 💵)"}</button>
    </div>
    ${state.nfts.length === 0 ? `<p class="muted">У вас нет NFT. Выбейте их в NFT-кейсах или купите на маркете.</p>` : ""}
    <div class="grid-3">
      ${state.nfts.map(item => {
        const sel = craftSelected.includes(item.id);
        const pat = PATTERNS.find(p => p.id === item.pattern);
        return `
          <div class="item-card rar-${item.isLimited ? "limited" : item.rarity} ${sel ? "picked" : ""}" onclick="toggleCraft('${item.id}')" style="cursor:pointer">
            <div class="item-bg" style="background:${itemBgCss(item)}">
              ${pat ? `<div class="pat-badge">${pat.emoji}</div>` : ""}
              ${item.number ? `<div class="num-badge">#${item.number}${numTag(item.number)}</div>` : ""}
              <div class="item-visual">${itemImg(item)}</div>
            </div>
            <div class="item-name">${item.name}</div>

}

function toggleCraft(id) {
  if (craftBusy) return;
  if (craftSelected.includes(id)) craftSelected = craftSelected.filter(x => x !== id);
  else {
    if (craftSelected.length >= 4) return toast("Максимум 4 NFT");
    craftSelected.push(id);
  }
  craftResultHtml = "";
  renderCraft();
}

function doCraft() {
  if (craftBusy) return;
  const plan = craftPlan();
  if (!plan) return toast("Выберите хотя бы 1 NFT");
  if (!canAfford("usd", 5)) return toast("Нужно 5 💵");

  // Результат определяем и сохраняем сразу
  craftBusy = true;
  craftResultHtml = "";
  addMoney("usd", -5);
  const ids = new Set(plan.items.map(x => x.id));
  state.nfts = state.nfts.filter(x => !ids.has(x.id));
  craftSelected = [];
  const win = Math.random() < plan.chance;
  let prize = null;
  if (win) { prize = makeItem(plan.result); state.nfts.push(prize); }
  save();
  updateBalanceUI();

  const btn = document.getElementById("craft-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Крафтим..."; }
  const anim = document.getElementById("craft-anim");
  let frame = 0;
  const spin = setInterval(() => {
    const a = document.getElementById("craft-anim");
    if (a) a.innerHTML = `<span>${["💎", "🔷", "✨", "🧊"][frame++ % 4]}</span>`.repeat(plan.items.length);
  }, 150);

  setTimeout(() => {
    clearInterval(spin);
    craftBusy = false;
    if (win) {
      craftResultHtml = `<span style="font-size:40px">✨</span><span style="font-size:40px">${prize.emoji}</span>`;
      toast(`Успех! Получен ${prize.name}`);
    } else {
      craftResultHtml = `<span style="font-size:40px">⚒️</span>`;
      toast("Провал. NFT сгорели.");
    }
    if (document.getElementById("view-craft").classList.contains("active")) renderCraft();
  }, 1800);
}

let marketTab = "buy";
const MARKET_LISTS = { buy: "globalLots", nft: "globalNftLots", usd: "globalUsdLots" };

function lotCard(lot, bodyHtml) {
  const it = lot.item;
  const pat = PATTERNS.find(p => p.id === it.pattern);
  return `
    <div class="item-card rar-${it.isLimited ? "limited" : it.rarity}">
      <div class="item-bg" style="background:${itemBgCss(it)}">
        ${pat ? `<div class="pat-badge">${pat.emoji}</div>` : ""}
        ${it.number ? `<div class="num-badge">#${it.number}${numTag(it.number)}</div>` : ""}
        <div class="item-visual">${itemImg(it)}</div>
      </div>
      <div class="item-name">${it.name}</div>
      ${bodyHtml}
    </div>`;
}

function renderLot(lot, kind) {
  const fairCur = fromStars(valueStars(lot.item), lot.currency);
  const diff = Math.round((lot.price / Math.max(0.0001, fairCur) - 1) * 100);
  // Premium («рентген»): видна оценка предмета и разница с ценой лота
  const xray = isPremium()
    ? `<div class="small" style="text-align:center;color:${diff <= 0 ? "var(--success)" : "var(--danger)"}">оценка ${fmtNum(fairCur)} (${diff > 0 ? "+" : ""}${diff}%)</div>`
    : "";
  return lotCard(lot, `
    <div class="item-price">${fmtNum(lot.price)} ${icon(lot.currency)}</div>
    ${xray}
    <button class="btn-purple" style="margin-top:6px" onclick="buyLot('${lot.id}', '${kind}')">Купить</button>`);
}

function renderMarket() {
  const el = document.getElementById("view-market");
  if (!el) return;
  let content = "";

  if (MARKET_LISTS[marketTab]) {
    const list = state[MARKET_LISTS[marketTab]] || [];
    content = list.length
      ? `<div class="grid-3">${list.map(lot => renderLot(lot, marketTab)).join("")}</div>`
      : "<p class='muted'>Лотов пока нет — боты скоро выставят новые.</p>";
  } else {
    if (!state.myLots.length) {
      content = "<p class='muted'>У вас нет активных лотов. Выставьте предмет из инвентаря.</p>";
    } else {
      content = `<p class="small muted" style="margin:0 0 10px">Боты покупают лоты по цене до 130% от оценки. Чем дешевле — тем быстрее.</p>
        <div class="grid-3">` + state.myLots.map(lot => {
        const d = demandInfo(priceRatio(lot));
        return lotCard(lot, `
          <div class="item-price">${fmtNum(lot.price)} ${icon(lot.currency)}</div>
          <div class="small" style="text-align:center;margin:4px 0;color:${d.ok ? "var(--success)" : "var(--danger)"}">${d.text}</div>
          <div class="row" style="gap:4px;margin-top:6px;flex-wrap:nowrap">
            <button class="btn-yellow" style="font-size:10px" onclick="instantSellLot('${lot.id}')">Сразу боту<span style="opacity:.7">−25%</span></button>
            <button class="btn-purple" style="font-size:10px" onclick="cancelLot('${lot.id}')">Снять</button>
          </div>`);
      }).join("") + `</div>`;
    }
  }

  el.innerHTML = `
    <div class="section-title">📈 Маркет</div>
    <div class="tabs" style="display:flex;gap:8px;margin-bottom:16px;overflow-x:auto">
      <button class="${marketTab === "buy" ? "sel" : ""}" onclick="setMarketTab('buy')">Купить</button>
      <button class="${marketTab === "nft" ? "sel" : ""}" onclick="setMarketTab('nft')">NFT</button>
      <button class="${marketTab === "usd" ? "sel" : ""}" onclick="setMarketTab('usd')">USD</button>
      <button class="${marketTab === "sell" ? "sel" : ""}" onclick="setMarketTab('sell')">Мои лоты (${state.myLots.length})</button>
    </div>
    ${content}
  `;
}

function setMarketTab(t) { marketTab = t; renderMarket(); }

function buyLot(id, kind) {
  const list = state[MARKET_LISTS[kind]];
  if (!list) return;
  const index = list.findIndex(x => x.id === id);
  if (index < 0) { toast("Этот лот уже купили"); renderMarket(); return; }

  const lot = list[index];
  if (!canAfford(lot.currency, lot.price)) return toast("Недостаточно средств");

  addMoney(lot.currency, -lot.price);
  list.splice(index, 1);
  addItem({ ...lot.item, id: uid() });

  save();
  updateBalanceUI();
  renderMarket();
  toast("Покупка успешна!");
}

// Мгновенная продажа боту: 75% оценки, без комиссии
function instantSellLot(lotId) {
  const index = state.myLots.findIndex(x => x.id === lotId);
  if (index < 0) return;
  const lot = state.myLots[index];
  const payout = roundCur(fromStars(valueStars(lot.item) * 0.75, lot.currency), lot.currency);
  addMoney(lot.currency, payout);
  state.myLots.splice(index, 1);
  save();
  updateBalanceUI();
  renderMarket();
  toast(`Продано боту за ${fmtNum(payout)} ${icon(lot.currency)}`);
}

function cancelLot(id) {
  const index = state.myLots.findIndex(x => x.id === id);
  if (index < 0) return;
  const lot = state.myLots.splice(index, 1)[0];
  addItem(lot.item);
  save();
  renderMarket();
  toast("Лот снят, предмет возвращён в инвентарь.");
}

/* v26 п.4 ГОТОВО: вход через Telegram.WebApp.initDataUnsafe.user.
   Вне Telegram (обычный браузер) работает демо-вход (@arbuzichok52). Имя и ник из Telegram всегда экранируются (esc).
   initData без сервера не проверить: это просто ник и аватар, а не защита. isOwner всегда false. */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function tgUser() {
  try {
    const u = window.Telegram?.WebApp?.initDataUnsafe?.user;
    return u && u.id ? u : null;
  } catch (e) { return null; }
}
function tgInitial(p) { return (Array.from(String(p && p.displayName || "?"))[0] || "?").toUpperCase(); }
// Содержимое кружка-аватара: фото (onerror -> буква) или буква. data-fb отключает общий обработчик ошибок картинок.
function tgAvatarInner(p) {
  if (p && typeof p.photoUrl === "string" && /^https:\/\/[^\s"'<>]+$/.test(p.photoUrl)) {
    return `<img src="${esc(p.photoUrl)}" alt="" data-fb="1" data-l="${esc(tgInitial(p))}" referrerpolicy="no-referrer" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block" onerror="this.parentNode.textContent=this.dataset.l">`;
  }
  return esc(tgInitial(p));
}
function guestNick(){let n="";try{n=String(prompt("Придумай себе ник (до 20 символов)","")||"").trim().slice(0,20);}catch(e){}return n||"Гость"+Math.floor(1000+Math.random()*9000);}
function completeTgLogin() {
  const u = tgUser();
  if (u) {
    try { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } catch (e) {}
    const name = [u.first_name, u.last_name].filter(Boolean).join(" ").trim() || ("id" + u.id);
    const photo = typeof u.photo_url === "string" && /^https:\/\/[^\s"'<>]+$/.test(u.photo_url) ? u.photo_url : null;
    state.tgProfile = {
      username: u.username ? "@" + String(u.username).slice(0, 32) : "id" + u.id,
      displayName: Array.from(name).slice(0, 40).join(""),
      photoUrl: photo,
      title: "Player",
      isOwner: false
    };
  } else {
    state.tgProfile = {
      username: "@guest",
      displayName: guestNick(),
      title: "Player",
      isOwner: false     // v26: права дают только через пароль (ADMIN_PASS), а не флагом
    };
  }
  save();
  document.getElementById("tg-login-screen").classList.remove("open");
  updateHeader();
  toast("Вы вошли как " + state.tgProfile.displayName);   // toast пишет через textContent
}

function init() {
  // Вход
  if (state.tgProfile) state.tgProfile.isOwner = false;     // v26: старые сейвы не дают прав
  if (IS_BETA && !state.tgProfile) {                       // v26: в бете логин через Telegram не нужен
    state.tgProfile = { username: "@beta", displayName: "Beta", title: "BETA", isOwner: false };
  }
  if (!state.tgProfile && !IS_BETA && tgUser()) completeTgLogin();   // v26 п.4: автовход, если Telegram отдал пользователя
  if (!state.tgProfile) {
    document.getElementById("tg-login-screen").classList.add("open");
  }

const FL="https://cdn.jsdelivr.net/npm/@lobehub/fluent-emoji-3d@1.1.0/assets/";
function emojiCps(e,keep){const a=[];for(const ch of e){const c=ch.codePointAt(0);if(c===0xFE0F&&!keep)continue;a.push(c.toString(16));}return a.join("-");}
function imgCands(e){const a=[FL+emojiCps(e)+".webp"],k=FL+emojiCps(e,1)+".webp";if(k!==a[0])a.push(k);a.push(twemojiUrlOld(e));return a;}
function imgNext(t){const c=imgCands(t.alt),s=(+t.dataset.st||0)+1;if(s>=c.length)return false;t.dataset.st=s;t.src=c[s];return true;}
function twemojiUrl(e){return e?imgCands(e)[0]:"";}
function emojiImg(e,size=40,st=""){return e?`<img src="${twemojiUrl(e)}" alt="${e}" width="${size}" height="${size}" style="vertical-align:middle;object-fit:contain;${st}">`:"";}
const RC={common:"#7d8cab",uncommon:"#4aa3ff",rare:"#4d6bff",epic:"#a35bff",legendary:"#ff5ba0",master:"#ff4b4b",limited:"#ffc83d"},_pc={};
function tgPat(sym){
  const k=sym||"d";if(_pc[k])return _pc[k];
  let s="";
  const ring=(r,n,z,o)=>{for(let i=0;i<n;i++){const a=(i/n+o)*6.2832,x=(50+r*Math.cos(a)).toFixed(1),y=(50+r*Math.sin(a)).toFixed(1);
    s+=sym?`<text x='${x}' y='${y}' font-size='${z*2.4}' text-anchor='middle' dominant-baseline='central' opacity='.3'>${sym}</text>`:`<path transform='translate(${x} ${y})' d='M0 -${z}L${z*.55} 0L0 ${z}L-${z*.55} 0Z' fill='white' opacity='.2'/>`;}};
  ring(34,8,3.4,0);ring(46,14,2.6,.03);
  return _pc[k]="data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>${s}</svg>`).replace(/'/g,"%27");
}
function itemBgCss(it){
  const b=it&&it.bg?BACKGROUNDS.find(x=>x.id===it.bg):null,p=it&&PATTERNS.find(x=>x.id===it.pattern);
  const pat=`url('${tgPat(p&&p.emoji)}') center/100% 100% no-repeat`;
  if(b)return pat+","+b.css;
  const c=RC[it&&(it.isLimited?"limited":it.rarity)]||RC.common;
  return `${pat},radial-gradient(circle at 50% 40%,${c}cc,${c}44 55%,#0e1222)`;
}

/* ===== v26: КОНТРАКТЫ =====
   Выбери 1–9 предметов (подарки и NFT) -> получи 1–2 предмета дороже или дешевле суммы.
   Баланс: шанс «лучше» ~40%, множитель до x3, ожидаемая выдача ~92% суммы (проверять симуляцией, см. HANDOFF_part3.md).
   Бета-режим ничем не отличается: контракты открыты всем. */
let ctSel=[],ctBusy=false,ctResultHtml="";
const CT_MAX=9, CT_WIN=0.40, CT_CAP=3;
let _ctPool=null;
function ctPool(){   // каталог без лимиток, по возрастанию цены в ⭐
  if(!_ctPool)_ctPool=[...Object.values(GIFTS),...Object.values(NFTS)].filter(b=>!b.isLimited).map(b=>({b,v:baseValue(b)})).sort((a,c)=>a.v-c.v);
  return _ctPool;
}
function ctNear(target){   // случайный из трёх ближайших по цене
  const p=ctPool();let lo=0,hi=p.length-1;
  while(lo<hi){const m=(lo+hi)>>1;if(p[m].v<target)lo=m+1;else hi=m;}
  return pick(p.slice(Math.max(0,lo-1),Math.min(p.length,lo+2))).b;
}
function ctItems(){return ctSel.map(id=>findItem(id)).filter(Boolean);}
function ctSum(){return ctItems().reduce((a,x)=>a+valueStars(x),0);}
// Бросок контракта: 40% «лучше» (множитель 1.05..3, смещён к низу), иначе 0.25..0.9. Среднее ~0.92.
function ctRoll(S){
  const up=Math.random()<CT_WIN;
  const m=up?1.05+(CT_CAP-1.05)*Math.pow(Math.random(),4):0.25+0.65*Math.random();
  const target=S*m, n=(target>=1500&&Math.random()<0.3)?2:1;
  const out=[];
  for(let i=0;i<n;i++)out.push(ctMake(target/n));
  return out;
}
// Подбор предмета под цель с учётом фона/узора/номера (они умножают цену NFT, поэтому база подбирается итеративно)
function ctMake(t){
  let tt=t,best=null,bestErr=1e18;
  for(let k=0;k<30;k++){
    const it=makeItem(ctNear(tt));if(it.type==="nft")decorateItem(it);
    const v=valueStars(it),err=Math.abs(Math.log(v/t));
    if(err<bestErr){bestErr=err;best=it;}
    if(v>=t*0.85&&v<=t*1.15)return it;
    tt=Math.max(1,tt*(t/v));
  }
  return best;
}
function renderContract(){
  ctSel=ctSel.filter(id=>findItem(id));
  const S=ctSum(),n=ctSel.length;
  const slots=Array.from({length:CT_MAX},(_,i)=>{const it=findItem(ctSel[i]);return `<div class="ct-slot${it?" full":""}" onclick="${it?`ctDel(${i})`:"ctPick()"}">${it?`<div class="cr-it" style="background:${itemBgCss(it)}">${emojiImg(it.emoji,38)}</div>`:"＋"}</div>`;}).join("");
  $("view-contract").innerHTML=`<div class="section-title">📜 Контракты</div><div class="box"><p class="small muted" style="margin:0 0 4px">Положите от 1 до ${CT_MAX} предметов (подарки и NFT). Контракт вернёт 1–2 случайных предмета: шанс получить дороже суммы около ${Math.round(CT_WIN*100)}%, максимум ×${CT_CAP}. Вложенное сгорает.</p>
  <div class="ct-board" id="ct-board"><div class="ct-grid">${slots}</div><div class="cr-flash" id="ct-flash"></div></div>
  <div class="ct-sum">${n?`Вложено: <b>${n}</b> шт. на <b>${fmtNum(S)} ⭐</b>`:"Выберите предметы"}</div>
  <div id="ct-out">${ctResultHtml}</div>
  <button class="btn-open-case" onclick="doContract()" ${ctBusy||!n?"disabled":""}>${ctBusy?"Подписываем...":"Подписать контракт"}</button></div>
  <div class="small muted" style="text-align:center">Нажмите на заполненный слот, чтобы убрать предмет</div>`;
}
function ctPick(){
  if(ctBusy||ctSel.length>=CT_MAX)return;
  const free=[...state.nfts,...state.gifts].filter(x=>!ctSel.includes(x.id));
  $("modal-info-body").innerHTML=`<button class="close" onclick="closeModal('modal-info')">×</button><div class="dialog-header"><h2>Выберите предмет</h2></div>${free.length?`<div class="grid-3">${free.map(it=>`<div class="item-card rar-${it.isLimited?"limited":it.rarity}" style="cursor:pointer" onclick="ctAdd('${it.id}')"><div class="item-bg" style="background:${itemBgCss(it)}">${it.number?`<div class="num-badge">#${it.number}${numTag(it.number)}</div>`:""}<div class="item-visual">${itemImg(it)}</div></div><div class="item-name">${it.name}</div><div class="item-price">${fmtNum(valueStars(it))} ⭐</div></div>`).join("")}</div>`:`<p class="muted">Инвентарь пуст.</p>`}`;
  openModal("modal-info");
}
function ctAdd(id){if(ctSel.length<CT_MAX&&!ctSel.includes(id))ctSel.push(id);ctResultHtml="";closeModal("modal-info");renderContract();}
function ctDel(i){if(ctBusy)return;ctSel.splice(i,1);ctResultHtml="";renderContract();}
function doContract(){
  if(ctBusy)return;
  const items=ctItems();
  if(!items.length)return toast("Положите хотя бы 1 предмет");

  const ids=new Set(items.map(x=>x.id));
  state.gifts=state.gifts.filter(x=>!ids.has(x.id));state.nfts=state.nfts.filter(x=>!ids.has(x.id));
  const out=ctRoll(S);out.forEach(addItem);
  const V=out.reduce((a,x)=>a+valueStars(x),0),up=V>S;
  save();updateBalanceUI();
  // анимация: слоты летят к центру -> вспышка -> результат
  const b=$("ct-board");
  b.querySelectorAll(".ct-slot.full").forEach(el=>{const r=el.getBoundingClientRect(),c=b.getBoundingClientRect();el.style.setProperty("--dx",(c.left+c.width/2-r.left-r.width/2)+"px");el.style.setProperty("--dy",(c.top+c.height/2-r.top-r.height/2)+"px");});
  b.classList.add("fuse");
  setTimeout(()=>{const f=$("ct-flash");if(f)f.classList.add("go");},1300);
  setTimeout(()=>{
    ctBusy=false;ctSel=[];
    ctResultHtml=`<div class="cr-reveal ${up?"":"cr-shake"}"><div class="cr-rays"><div class="ct-out">${out.map(p=>`<div class="item-card rar-${p.isLimited?"limited":p.rarity}" style="width:${out.length>1?120:150}px"><div class="item-bg" style="height:100px;background:${itemBgCss(p)}"><div class="item-visual">${itemImg(p,'style="width:72px;height:72px"')}</div></div><div class="item-name">${p.name}</div><div class="item-price">${fmtNum(valueStars(p))} ⭐</div></div>`).join("")}</div></div><h3 style="color:var(--${up?"success":"danger"});margin:6px 0">${up?"🎉 Выгодный контракт!":"📉 Контракт невыгодный"} ${fmtNum(S)} → ${fmtNum(V)} ⭐</h3></div>`;
    if($("view-contract").classList.contains("active"))renderContract();
    toast(up?"Контракт в плюс!":"Контракт в минус");
  },2000);
}
